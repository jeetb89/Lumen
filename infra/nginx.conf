server {
  listen 80;

  location /api/ {
    proxy_pass         http://chatbot:8000/api/;
    proxy_buffering    off;          # critical for SSE — buffering breaks token streaming
    proxy_cache        off;
    proxy_set_header   Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://frontend:80/;
  }
}
