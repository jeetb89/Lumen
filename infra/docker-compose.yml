name: ollivebird

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loglm
      POSTGRES_PASSWORD: loglm
      POSTGRES_DB: loglm
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loglm"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: loglm
      CLICKHOUSE_USER: loglm
      CLICKHOUSE_PASSWORD: loglm
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  ingestion:
    build: ../ingestion
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: loglm
      CLICKHOUSE_PASSWORD: loglm
      CLICKHOUSE_DB: loglm
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  chatbot:
    build:
      context: ..
      dockerfile: chatbot/Dockerfile
    environment:
      DATABASE_URL: postgresql://loglm:loglm@postgres:5432/loglm
      LOGLM_INGEST_URL: http://ingestion:8001/v1/logs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      ingestion: {condition: service_healthy}

  frontend:
    build: ../frontend
    depends_on:
      - chatbot

  gateway:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chatbot
      - frontend

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      clickhouse: {condition: service_healthy}

volumes:
  pgdata:
  chdata:
  grafana_data:
